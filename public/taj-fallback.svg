<svg xmlns="http://www.w3.org/2000/svg" width="390" height="520" viewBox="0 0 390 520">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#eaf6ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc36a"/>
      <stop offset="1" stop-color="#5aa84a"/>
    </linearGradient>
  </defs>
  <rect width="390" height="520" fill="url(#sky)"/>
  <rect y="330" width="390" height="190" fill="url(#grass)"/>
  <!-- reflecting pool -->
  <rect x="160" y="360" width="70" height="150" rx="6" fill="#9bd0e8"/>
  <!-- plinth -->
  <rect x="95" y="300" width="200" height="40" fill="#f3f0ea"/>
  <!-- main building -->
  <rect x="135" y="210" width="120" height="100" rx="6" fill="#fbfaf7"/>
  <!-- big arch -->
  <path d="M170 310 v-45 a25 25 0 0 1 50 0 v45 z" fill="#d9d2c7"/>
  <!-- dome -->
  <path d="M155 210 q40 -90 80 0 z" fill="#fdfdfb"/>
  <ellipse cx="195" cy="210" rx="40" ry="10" fill="#efe9df"/>
  <!-- finial -->
  <rect x="192" y="108" width="6" height="22" fill="#e9d8a6"/>
  <circle cx="195" cy="104" r="7" fill="#e9d8a6"/>
  <!-- minarets -->
  <rect x="112" y="200" width="12" height="120" rx="4" fill="#f3efe8"/>
  <rect x="266" y="200" width="12" height="120" rx="4" fill="#f3efe8"/>
  <circle cx="118" cy="196" r="9" fill="#fbfaf7"/>
  <circle cx="272" cy="196" r="9" fill="#fbfaf7"/>
  <text x="195" y="495" font-family="Poppins,Arial" font-size="15" font-weight="700"
        fill="#2f6b2a" text-anchor="middle">Taj Mahal · Agra</text>
  <text x="195" y="50" font-family="Poppins,Arial" font-size="11"
        fill="#5b7fa3" text-anchor="middle" opacity="0.8">add public/taj.jpg to use your image</text>
</svg>
